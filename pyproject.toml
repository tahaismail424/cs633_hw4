[project]
name = "fall26ml-hw4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "libauc",
    "matplotlib>=3.11.2",
    "medmnist",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
fall26ml-hw4 = "fall26ml_hw4:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
libauc = { path = "LibAUC", editable = true }
medmnist = { git = "https://github.com/MedMNIST/MedMNIST.git" }
